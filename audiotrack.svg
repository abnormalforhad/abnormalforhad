<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#140a0f"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes bar1 { 0%, 100% { height: 12px; y: 36px; } 50% { height: 38px; y: 10px; } }
    @keyframes bar2 { 0%, 100% { height: 28px; y: 20px; } 50% { height: 8px; y: 40px; } }
    @keyframes bar3 { 0%, 100% { height: 18px; y: 30px; } 50% { height: 42px; y: 6px; } }
    @keyframes bar4 { 0%, 100% { height: 35px; y: 13px; } 50% { height: 14px; y: 34px; } }
    @keyframes bar5 { 0%, 100% { height: 10px; y: 38px; } 50% { height: 32px; y: 16px; } }
    @keyframes bar6 { 0%, 100% { height: 26px; y: 22px; } 50% { height: 44px; y: 4px; } }
    @keyframes bar7 { 0%, 100% { height: 40px; y: 8px; } 50% { height: 16px; y: 32px; } }
    @keyframes bar8 { 0%, 100% { height: 14px; y: 34px; } 50% { height: 36px; y: 12px; } }
    @keyframes bar9 { 0%, 100% { height: 30px; y: 18px; } 50% { height: 12px; y: 36px; } }
    @keyframes bar10 { 0%, 100% { height: 20px; y: 28px; } 50% { height: 40px; y: 8px; } }
    @keyframes bar11 { 0%, 100% { height: 36px; y: 12px; } 50% { height: 18px; y: 30px; } }
    @keyframes bar12 { 0%, 100% { height: 16px; y: 32px; } 50% { height: 28px; y: 20px; } }

    .disk { transform-origin: 55px 55px; animation: spin 5s linear infinite; }
    .led { animation: pulse 2s ease-in-out infinite; }
    .b1 { animation: bar1 1.1s ease-in-out infinite; }
    .b2 { animation: bar2 0.9s ease-in-out infinite; }
    .b3 { animation: bar3 1.3s ease-in-out infinite; }
    .b4 { animation: bar4 0.8s ease-in-out infinite; }
    .b5 { animation: bar5 1.2s ease-in-out infinite; }
    .b6 { animation: bar6 1.0s ease-in-out infinite; }
    .b7 { animation: bar7 1.4s ease-in-out infinite; }
    .b8 { animation: bar8 0.75s ease-in-out infinite; }
    .b9 { animation: bar9 1.15s ease-in-out infinite; }
    .b10 { animation: bar10 0.85s ease-in-out infinite; }
    .b11 { animation: bar11 1.25s ease-in-out infinite; }
    .b12 { animation: bar12 0.95s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="858" height="108" x="1" y="1" rx="10" fill="url(#cardBg)" stroke="#27151e" stroke-width="1.2"/>

  <!-- Left: Vinyl Record / Disk with center core -->
  <g class="disk">
    <circle cx="55" cy="55" r="38" fill="url(#discGrad)" stroke="#3f1422" stroke-width="2"/>
    <circle cx="55" cy="55" r="30" fill="none" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="55" cy="55" r="22" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.6"/>
    <circle cx="55" cy="55" r="14" fill="#e11d48" opacity="0.85"/>
    <circle cx="55" cy="55" r="5" fill="#0c0e14"/>
  </g>

  <!-- Playhead indicator badge -->
  <circle cx="110" cy="30" r="3.5" fill="#f43f5e" class="led"/>
  <text x="122" y="34" fill="#f43f5e" font-size="10" font-weight="700" class="mono" letter-spacing="1">CURRENTLY DECRYPTING</text>

  <!-- Title & Metadata -->
  <text x="110" y="55" fill="#f1f5f9" font-size="14" font-weight="700" class="sans">
    0xAF // midnight_protocol.flac
  </text>
  <text x="110" y="73" fill="#881337" font-size="11" class="mono">
    <tspan fill="#94a3b8">GF(256) Shamir DKG</tspan> · <tspan fill="#f43f5e">AES-256-GCM</tspan> · <tspan fill="#38bdf8">Sepolia Block Stream</tspan>
  </text>

  <!-- Progress Bar & Scrubber -->
  <g transform="translate(110, 84)">
    <rect width="360" height="3" rx="1.5" fill="#1e293b"/>
    <rect width="215" height="3" rx="1.5" fill="url(#crimsonGrad)"/>
    <circle cx="215" cy="1.5" r="4" fill="#fb7185"/>
    <text x="375" y="5" fill="#64748b" font-size="9" class="mono">02:41 / 04:20</text>
  </g>

  <!-- Right: Dynamic Animated Equalizer Bars -->
  <g transform="translate(680, 28)">
    <rect class="b1" x="0" width="6" rx="2" fill="#e11d48"/>
    <rect class="b2" x="11" width="6" rx="2" fill="#f43f5e"/>
    <rect class="b3" x="22" width="6" rx="2" fill="#fb7185"/>
    <rect class="b4" x="33" width="6" rx="2" fill="#e11d48"/>
    <rect class="b5" x="44" width="6" rx="2" fill="#f43f5e"/>
    <rect class="b6" x="55" width="6" rx="2" fill="#fb7185"/>
    <rect class="b7" x="66" width="6" rx="2" fill="#e11d48"/>
    <rect class="b8" x="77" width="6" rx="2" fill="#f43f5e"/>
    <rect class="b9" x="88" width="6" rx="2" fill="#fb7185"/>
    <rect class="b10" x="99" width="6" rx="2" fill="#e11d48"/>
    <rect class="b11" x="110" width="6" rx="2" fill="#f43f5e"/>
    <rect class="b12" x="121" width="6" rx="2" fill="#fb7185"/>
  </g>
</svg>
